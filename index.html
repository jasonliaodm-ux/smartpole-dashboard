<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新竹智慧桿即時資訊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 公開看板：深色底、大字、遠距離可讀；左影像、右空品，手機改上下排列 */
:root{--bg:#0B1420;--card:#111D2B;--line:#1E3247;--ink:#E8EEF4;--mute:#9FB0C0;--dim:#7F93A6;--accent:#7FD8E6;
  --mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Noto Sans TC',system-ui,sans-serif}
.wrap{min-height:100vh;padding:28px 32px 24px;display:flex;flex-direction:column;gap:20px;max-width:1920px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:48px;height:48px;border-radius:12px;background:#13283A;display:grid;place-items:center;flex:none}
h1{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:900;letter-spacing:.02em}
h2{margin:0;font-size:20px;font-weight:700}
.sub{font-size:15px;color:var(--mute)}
.clock{text-align:right}
.clock b{display:block;font-family:var(--mono);font-size:clamp(24px,2.4vw,32px)}
.clock span{font-size:14px;color:var(--mute)}
main{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.video{flex:999 1 640px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#3A1416;color:#FF8A8F}
.live i{width:8px;height:8px;border-radius:50%;background:#FF5A62}
.live.off{background:#1E3247;color:var(--mute)}.live.off i{background:var(--dim)}
.screen{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#050A10}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#8DA2B5;font-size:17px;text-align:center;padding:20px}
.msg[hidden]{display:none}
.stamp{position:absolute;left:14px;top:12px;background:rgba(0,0,0,.55);color:#fff;font:13px var(--mono);padding:4px 10px;border-radius:6px}
.fs{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:10px;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.fs:focus-visible,select:focus-visible,.dev:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--dim)}
.air{flex:1 1 380px;display:flex;flex-direction:column;gap:14px}
select{height:40px;background:var(--bg);color:var(--ink);border:1px solid #2A4560;border-radius:8px;padding:0 10px;font:15px var(--mono)}
.hero{display:flex;align-items:center;gap:18px;border-radius:12px;padding:16px 18px;transition:background .4s}
.dial{width:88px;height:88px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;transition:background .4s}
.dial small{font-size:12px;font-weight:700}
.dial b{font:700 30px/1 var(--mono)}
.lvl{font-size:30px;font-weight:900;line-height:1.2}
.adv{font-size:15px;line-height:1.5;opacity:.9}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.m{display:flex;flex-direction:column;gap:6px;border-radius:14px}
.m .k{font-size:14px;color:var(--mute)}
.m .v{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.m .v b{font:700 clamp(28px,2.6vw,38px) var(--mono)}
.m .v span{font-size:13px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--line)}
.bar i{display:block;height:6px;border-radius:3px;width:0;transition:width .6s}
.tag{font-size:13px}
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.scale div{height:8px;border-radius:2px}
.scale.lab{font-size:11px;color:var(--mute);text-align:center}
.scale.lab span.on{color:var(--ink);font-weight:700}
.devs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dev{min-height:44px;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink);font:13px var(--mono);display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left}
.dev .n{color:var(--mute);display:flex;align-items:center;gap:6px}
.dev .n i{width:8px;height:8px;border-radius:50%}
.dev b{font-size:16px}
.dev.on{background:#17324A;border-color:var(--accent)}
.dev.stale b{color:var(--dim)}
.warn{display:none;font-size:13px;font-weight:700;color:#F2C94C;background:#3A3010;border-radius:999px;padding:3px 10px}
.warn.show{display:inline-block}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
@media(max-width:600px){.wrap{padding:16px 14px}.clock{text-align:left}.devs{grid-template-columns:repeat(2,minmax(0,1fr))}.lvl{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7FD8E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M8 6h8"/><path d="M6 22h12"/><circle cx="12" cy="10" r="2"/></svg></div>
      <div>
        <h1 id="siteName">新竹市智慧桿即時資訊</h1>
        <div class="sub" id="siteSub">空氣品質、環境噪音與現場即時影像</div>
      </div>
    </div>
    <div class="clock" aria-live="off"><b id="clkT">--:--:--</b><span id="clkD"></span></div>
  </header>

  <main>
    <section class="card video" aria-label="即時影像">
      <div class="row">
        <div style="display:flex;align-items:center;gap:10px"><h2>即時影像</h2><span class="live off" id="liveTag"><i></i><span id="liveTxt">連線中</span></span></div>
        <div class="sub" id="camName">鏡頭：BayfunPier</div>
      </div>
      <div class="screen" id="screen">
        <video id="vid" muted autoplay playsinline></video>
        <div class="msg" id="vmsg">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
          <span id="vmsgTxt">影像載入中…</span>
        </div>
        <div class="stamp" id="vstamp">--</div>
        <button class="fs" id="fsBtn" type="button" aria-label="全螢幕播放"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
      </div>
      <div class="foot"><span id="vstate">串流狀態：連線中</span><span>畫面僅供即時觀看</span></div>
    </section>

    <section class="air" aria-label="空氣品質">
      <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px">
        <div class="row">
          <h2>空氣品質</h2>
          <div style="display:flex;align-items:center;gap:10px">
            <label for="devSel" class="sub" style="font-size:13px">感測桿</label>
            <select id="devSel"></select>
          </div>
        </div>
        <div class="row" style="justify-content:flex-start;gap:10px">
          <span class="sub" style="font-size:13px" id="mTime">量測時間 --</span>
          <span class="warn" id="staleTag">資料延遲</span>
        </div>
        <div class="hero" id="hero">
          <div class="dial" id="dial"><small>PM2.5</small><b id="dialV">--</b></div>
          <div><div class="lvl" id="lvl">--</div><div class="adv" id="adv">資料載入中</div></div>
        </div>
      </div>

      <div class="grid2">
        <div class="card m"><div class="k">PM2.5 細懸浮微粒</div><div class="v"><b id="vPm">--</b><span>μg/m³</span></div><div class="bar"><i id="bPm"></i></div><div class="tag" id="tPm"></div></div>
        <div class="card m"><div class="k">環境噪音（平均）</div><div class="v"><b id="vDb">--</b><span>dB</span></div><div class="bar"><i id="bDb"></i></div><div class="tag" id="tDb"></div></div>
        <div class="card m"><div class="k">溫度</div><div class="v"><b id="vT">--</b><span>°C</span></div></div>
        <div class="card m"><div class="k">相對濕度</div><div class="v"><b id="vH">--</b><span>%</span></div></div>
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <div class="k sub" style="font-size:14px">PM2.5 指標等級（環境部）</div>
        <div class="scale" id="pmScale" style="--n:6"></div>
        <div class="scale lab" id="pmLab" style="--n:6"></div>
        <div class="k sub" style="font-size:14px;margin-top:6px">噪音等級（參考分級）</div>
        <div class="scale" id="dbScale" style="--n:4"></div>
        <div class="scale lab" id="dbLab" style="--n:4"></div>
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <div class="sub" style="font-size:14px">周邊感測桿 PM2.5（μg/m³）· 點選切換</div>
        <div class="devs" id="devs"></div>
      </div>
    </section>
  </main>

  <footer>
    <span id="srcLine">資料來源：新竹市物聯網平台 · 智慧桿感測器（每 60 秒更新）</span>
    <span>本頁數值為感測器即時量測，僅供參考，不代表環境部官方測站數據</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
{
/* ===== 設定：部署時只需改這裡 ===== */
const CONFIG = {
  API_URL: 'https://www.hsinchuiot.org/core/share/realtimelatest/SmartPole',  // 若遇 CORS，改為自家代理路徑，例如 '/api/smartpole'
  HLS_URL: 'https://stream-hls.rogy360.live/BayfunPier/index.m3u8',
  DEFAULT_DEVICE: 'UIT953',
  CAMERA_NAME: 'BayfunPier',
  REFRESH_SEC: 60,
  STALE_MIN: 10,
  DEVICE_NAMES: { /* 'UIT953': '東門城' */ }
};

const $ = id => document.getElementById(id);
const PM = [ // 環境部 PM2.5 指標
  {max:15.4, name:'良好', c:'#2FBF71', bg:'#0F2A1E', ink:'#5EE39A', adv:'空氣品質佳，適合戶外活動。'},
  {max:35.4, name:'普通', c:'#F2C94C', bg:'#2E2810', ink:'#F7DA7A', adv:'極特殊敏感族群建議注意可能的咳嗽或呼吸急促。'},
  {max:54.4, name:'對敏感族群不健康', c:'#F2994A', bg:'#33200E', ink:'#F8B77C', adv:'敏感族群應減少戶外活動。'},
  {max:150.4, name:'對所有族群不健康', c:'#EB5757', bg:'#361314', ink:'#F59090', adv:'所有人應減少戶外劇烈活動，外出建議配戴口罩。'},
  {max:250.4, name:'非常不健康', c:'#9B51E0', bg:'#26143A', ink:'#C69AF0', adv:'所有人應避免戶外活動，盡量留在室內。'},
  {max:Infinity, name:'危害', c:'#A33A3A', bg:'#2E1010', ink:'#E08A8A', adv:'所有人應避免外出，並關閉門窗。'}
];
const DB = [ // 參考分級（非法規判定）
  {max:55, name:'安靜', c:'#2FBF71'},
  {max:65, name:'普通', c:'#F2C94C'},
  {max:75, name:'吵雜', c:'#F2994A'},
  {max:Infinity, name:'非常吵雜', c:'#EB5757'}
];
const lv = (arr, v) => arr.find(x => v <= x.max) || arr[arr.length-1];
const fmt = (v, d=1) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '--';
const pad = n => String(n).padStart(2,'0');
const WK = '日一二三四五六';
const label = id => CONFIG.DEVICE_NAMES[id] ? `${id} · ${CONFIG.DEVICE_NAMES[id]}` : id;

/* 刻度條 */
function scale(boxId, labId, arr, short){
  $(boxId).replaceChildren(...arr.map(x => { const d=document.createElement('div'); d.style.background=x.c; return d; }));
  $(labId).replaceChildren(...arr.map((x,i) => { const s=document.createElement('span'); s.textContent=short?short[i]:x.name; return s; }));
}
scale('pmScale','pmLab',PM,['良好','普通','敏感族群','不健康','非常不健康','危害']);
scale('dbScale','dbLab',DB,['安靜 <55','普通 55–65','吵雜 65–75','非常吵雜 ≥75']);
const mark = (labId, idx) => [...$(labId).children].forEach((s,i) => s.classList.toggle('on', i===idx));

/* 時鐘 */
function tick(){
  const d = new Date();
  $('clkT').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('clkD').textContent = `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${WK[d.getDay()]}）`;
  $('vstamp').textContent = `${CONFIG.CAMERA_NAME} · ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${$('clkT').textContent}`;
}
tick(); setInterval(tick, 1000);

/* 空品 */
let rows = [], current = CONFIG.DEFAULT_DEVICE;
try { current = localStorage.getItem('sp-device') || current; } catch(e) {}
const isStale = r => { const t = new Date(r.Time); return isNaN(t) || (Date.now() - t) > CONFIG.STALE_MIN*60000; };

function renderSelect(){
  const sel = $('devSel');
  const ids = rows.map(r => r.Device);
  if (!ids.includes(current)) current = ids.includes(CONFIG.DEFAULT_DEVICE) ? CONFIG.DEFAULT_DEVICE : (ids[0] || current);
  sel.replaceChildren(...ids.map(id => { const o=document.createElement('option'); o.value=id; o.textContent=label(id); return o; }));
  sel.value = current;
}

function renderMain(){
  const r = rows.find(x => x.Device === current);
  if (!r) return;
  const pm = Number(r.pm25), db = Number(r.sound_avg), t = Number(r['溫度']), h = Number(r['濕度']);
  const p = lv(PM, pm), n = lv(DB, db);
  $('mTime').textContent = '量測時間 ' + String(r.Time || '--').replace('T',' ');
  $('staleTag').classList.toggle('show', isStale(r));
  $('hero').style.background = p.bg;
  $('dial').style.background = p.c; $('dial').style.color = '#0B1420';
  $('dialV').textContent = fmt(pm);
  $('lvl').textContent = p.name; $('lvl').style.color = p.ink;
  $('adv').textContent = p.adv; $('adv').style.color = p.ink;
  $('vPm').textContent = fmt(pm); $('vDb').textContent = fmt(db);
  $('vT').textContent = fmt(t); $('vH').textContent = fmt(h);
  $('bPm').style.width = Math.min(100, pm/54.4*100) + '%'; $('bPm').style.background = p.c;
  $('tPm').textContent = p.name; $('tPm').style.color = p.c;
  $('bDb').style.width = Math.min(100, Math.max(0,(db-30)/60*100)) + '%'; $('bDb').style.background = n.c;
  $('tDb').textContent = n.name; $('tDb').style.color = n.c;
  mark('pmLab', PM.indexOf(p)); mark('dbLab', DB.indexOf(n));
}

function renderDevs(){
  $('devs').replaceChildren(...rows.map(r => {
    const b = document.createElement('button'); b.type='button';
    b.className = 'dev' + (r.Device===current?' on':'') + (isStale(r)?' stale':'');
    b.setAttribute('aria-pressed', r.Device===current);
    const n = document.createElement('span'); n.className='n';
    const dot = document.createElement('i'); dot.style.background = lv(PM, Number(r.pm25)).c;
    const nm = document.createElement('span'); nm.textContent = CONFIG.DEVICE_NAMES[r.Device] || r.Device.replace(/^UIT/,'');
    n.append(dot, nm);
    const v = document.createElement('b'); v.textContent = fmt(Number(r.pm25));
    b.append(n, v);
    b.addEventListener('click', () => choose(r.Device));
    return b;
  }));
}

function choose(id){
  current = id;
  try { localStorage.setItem('sp-device', id); } catch(e) {}
  $('devSel').value = id; renderMain(); renderDevs();
}
$('devSel').addEventListener('change', e => choose(e.target.value));

async function load(){
  try {
    const res = await fetch(CONFIG.API_URL + (CONFIG.API_URL.includes('?')?'&':'?') + '_=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error('empty');
    rows = data.filter(r => r && typeof r.Device === 'string').sort((a,b) => a.Device.localeCompare(b.Device));
    renderSelect(); renderMain(); renderDevs();
    $('srcLine').textContent = `資料來源：新竹市物聯網平台 · 智慧桿感測器（每 ${CONFIG.REFRESH_SEC} 秒更新，最後取得 ${$('clkT').textContent}）`;
  } catch (e) {
    console.warn('[SmartPole] 讀取失敗', e);
    if (!rows.length) { $('lvl').textContent = '暫無資料'; $('adv').textContent = '空品資料連線失敗，系統將自動重試。'; }
    $('staleTag').textContent = '資料連線失敗'; $('staleTag').classList.add('show');
  }
}
load(); setInterval(load, CONFIG.REFRESH_SEC*1000);

/* 影像 */
const vid = $('vid');
$('camName').textContent = '鏡頭：' + CONFIG.CAMERA_NAME;
function vstate(live, txt, overlay){
  $('liveTag').classList.toggle('off', !live);
  $('liveTxt').textContent = live ? 'LIVE' : '離線';
  $('vstate').textContent = '串流狀態：' + txt;
  $('vmsg').hidden = !overlay; if (overlay) $('vmsgTxt').textContent = overlay;
}
vid.addEventListener('playing', () => vstate(true, '播放中', ''));
vid.addEventListener('waiting', () => vstate(true, '緩衝中', ''));

let hls, retry;
function startVideo(){
  clearTimeout(retry);
  vstate(false, '連線中', '影像載入中…');
  if (window.Hls && Hls.isSupported()) {
    if (hls) hls.destroy();
    hls = new Hls({liveSyncDurationCount:3, lowLatencyMode:true});
    hls.loadSource(CONFIG.HLS_URL);
    hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      vstate(false, '中斷，30 秒後重新連線', '影像暫時無法連線，系統將自動重試');
      retry = setTimeout(startVideo, 30000);
    });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    vid.src = CONFIG.HLS_URL;
    vid.addEventListener('error', () => { vstate(false, '中斷，30 秒後重新連線', '影像暫時無法連線，系統將自動重試'); retry = setTimeout(() => { vid.src = CONFIG.HLS_URL; vid.load(); }, 30000); }, {once:false});
    vid.play().catch(()=>{});
  } else {
    vstate(false, '不支援', '此瀏覽器不支援 HLS 播放');
  }
}
startVideo();

$('fsBtn').addEventListener('click', () => {
  const el = $('screen');
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
    else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
  } catch(e) {}
});
}
</script>
</body>
</html>
